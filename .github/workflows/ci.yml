name: RaceDay CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # JOB 1: Validate Documentation (Part 1)
  # ============================================================
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Check for required docs folder
        run: |
          if [ ! -d "docs" ]; then
            echo "❌ docs folder not found!"
            exit 1
          fi
          echo "✅ docs folder found"
          
      - name: Check for ERD diagram
        run: |
          if [ ! -f "docs/ERD.png" ] && [ ! -f "docs/ERD.pdf" ]; then
            echo "❌ ERD diagram not found in docs folder!"
            exit 1
          fi
          echo "✅ ERD diagram found"
          
      - name: Check for API Endpoint Plan
        run: |
          if [ ! -f "docs/API_ENDPOINT_PLAN.pdf" ] && [ ! -f "docs/API_ENDPOINT_PLAN.md" ]; then
            echo "❌ API Endpoint Plan not found in docs folder!"
            exit 1
          fi
          echo "✅ API Endpoint Plan found"
          
      - name: Check for SQL Script
        run: |
          if [ ! -f "docs/raceday_eventDB.sql" ]; then
            echo "❌ SQL script not found in docs folder!"
            exit 1
          fi
          echo "✅ SQL script found"
          
      - name: Check for README
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found!"
            exit 1
          fi
          echo "✅ README.md found"
          
      - name: Validate SQL Script (Basic Syntax Check)
        run: |
          echo "🔍 Validating SQL script..."
          if grep -i "DROP DATABASE" docs/raceday_eventDB.sql; then
            echo "⚠️ Warning: Script contains DROP DATABASE statement"
          fi
          echo "✅ SQL script validation complete"

  # ============================================================
  # JOB 2: Build and Test API (Part 2)
  # ============================================================
  build-api:
    name: Build & Test API
    runs-on: ubuntu-latest
    needs: validate-docs
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Your_password123!"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'Your_password123!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x
          
      - name: Setup Node.js (for Swagger validation)
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Wait for SQL Server to be ready
        run: |
          echo "⏳ Waiting for SQL Server to start..."
          for i in {1..30}; do
            if /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'Your_password123!' -Q "SELECT 1" &>/dev/null; then
              echo "✅ SQL Server is ready!"
              break
            fi
            echo "Waiting for SQL Server... (attempt $i/30)"
            sleep 5
          done
          
      - name: Create Database
        run: |
          echo "📦 Creating database..."
          /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'Your_password123!' -i docs/raceday_eventDB.sql
          echo "✅ Database created successfully!"
          
      - name: Verify Database
        run: |
          echo "🔍 Verifying database..."
          /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'Your_password123!' -Q "USE raceday_eventDB; SELECT COUNT(*) AS TableCount FROM INFORMATION_SCHEMA.TABLES;"
          echo "✅ Database verification complete!"
          
      - name: Restore dependencies
        run: |
          echo "📦 Restoring dependencies..."
          if [ -d "RaceDayAPI" ]; then
            cd RaceDayAPI
            dotnet restore
            cd ..
          else
            echo "⚠️ RaceDayAPI folder not found - skipping API build"
          fi
          
      - name: Build API
        run: |
          echo "🔨 Building API..."
          if [ -d "RaceDayAPI" ]; then
            cd RaceDayAPI
            dotnet build --no-restore --configuration Release
            cd ..
          else
            echo "⚠️ RaceDayAPI folder not found - skipping API build"
          fi
          
      - name: Run Unit Tests
        run: |
          echo "🧪 Running unit tests..."
          if [ -d "RaceDayAPI.Tests" ]; then
            cd RaceDayAPI.Tests
            dotnet test --no-build --configuration Release --verbosity normal
            cd ..
          elif [ -d "RaceDayAPI" ] && [ -d "RaceDayAPI/Test" ]; then
            cd RaceDayAPI
            dotnet test --no-build --configuration Release --verbosity normal
            cd ..
          else
            echo "⚠️ Test project not found - skipping tests"
          fi

  # ============================================================
  # JOB 3: Build MVC Application (Part 3)
  # ============================================================
  build-mvc:
    name: Build MVC Application
    runs-on: ubuntu-latest
    needs: build-api
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x
          
      - name: Restore dependencies
        run: |
          echo "📦 Restoring MVC dependencies..."
          if [ -d "RaceDayMVC" ]; then
            cd RaceDayMVC
            dotnet restore
            cd ..
          else
            echo "⚠️ RaceDayMVC folder not found - skipping MVC build"
          fi
          
      - name: Build MVC
        run: |
          echo "🔨 Building MVC application..."
          if [ -d "RaceDayMVC" ]; then
            cd RaceDayMVC
            dotnet build --no-restore --configuration Release
            cd ..
          else
            echo "⚠️ RaceDayMVC folder not found - skipping MVC build"
          fi
          
      - name: Publish MVC
        run: |
          echo "📦 Publishing MVC application..."
          if [ -d "RaceDayMVC" ]; then
            cd RaceDayMVC
            dotnet publish -c Release -o ./publish
            cd ..
          else
            echo "⚠️ RaceDayMVC folder not found - skipping publish"
          fi

  # ============================================================
  # JOB 4: Docker Build (Part 3)
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-mvc
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          if [ -f "Dockerfile" ]; then
            docker build -t raceday-mvc:latest .
            echo "✅ Docker image built successfully!"
          else
            echo "⚠️ Dockerfile not found - skipping Docker build"
          fi
          
      - name: Verify Docker image
        run: |
          echo "🔍 Verifying Docker image..."
          if [ -f "Dockerfile" ]; then
            docker images raceday-mvc:latest
            echo "✅ Docker image verification complete!"
          fi

  # ============================================================
  # JOB 5: Security Scan
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Run Security Scan (Basic)
        run: |
          echo "🔒 Running security checks..."
          
          # Check for sensitive information in files
          echo "Checking for sensitive information..."
          if grep -r "password\|secret\|key" --include="*.cs" --include="*.sql" --include="*.json" . | grep -v "test" | grep -v "example"; then
            echo "⚠️ Potential sensitive information found in files!"
            echo "Please review the following files for sensitive data:"
            grep -r "password\|secret\|key" --include="*.cs" --include="*.sql" --include="*.json" . | grep -v "test" | grep -v "example"
          else
            echo "✅ No sensitive information found in files."
          fi
          
          # Check for SQL injection vulnerabilities in SQL files
          echo "Checking for SQL injection vulnerabilities..."
          if grep -i "exec\|execute\|sp_" docs/raceday_eventDB.sql | grep -v "CREATE\|ALTER\|DROP"; then
            echo "⚠️ Potential dynamic SQL found!"
          else
            echo "✅ No dynamic SQL vulnerabilities found."
          fi
          
          echo "✅ Security scan complete!"

  # ============================================================
  # JOB 6: Notify Completion
  # ============================================================
  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [validate-docs, build-api, build-mvc, docker-build, security-scan]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "=================================================="
          echo "🏁 RaceDay CI/CD Pipeline Complete!"
          echo "=================================================="
          echo ""
          echo "📊 Job Status Summary:"
          echo "  ✅ Validate Documentation: ${{ needs.validate-docs.result }}"
          echo "  ✅ Build & Test API: ${{ needs.build-api.result }}"
          echo "  ✅ Build MVC Application: ${{ needs.build-mvc.result }}"
          echo "  ✅ Docker Build: ${{ needs.docker-build.result }}"
          echo "  ✅ Security Scan: ${{ needs.security-scan.result }}"
          echo ""
          echo "=================================================="
          
          if [ "${{ needs.validate-docs.result }}" == "success" ] && \
             [ "${{ needs.build-api.result }}" == "success" ]; then
            echo "✅ All critical jobs completed successfully!"
            exit 0
          else
            echo "❌ Some jobs failed. Please check the logs."
            exit 1
          fi
