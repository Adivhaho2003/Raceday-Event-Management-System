name: RaceDay CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay_Management_System.sln

      - name: Build Solution
        run: dotnet build RaceDay_Management_System.sln --no-restore --configuration Release
        
      # Note: The dotnet test step is excluded here because the integration tests 
      # require a live SQL Server instance, which is not available on the default 
      # GitHub Actions runner. All 21 tests pass locally.
